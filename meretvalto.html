<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Méretváltó</title>

    <!-- Alap stílusok (főoldal + gomb dizájn) -->
    <link rel="stylesheet" href="style.css">

    <!-- Méretváltó oldal saját stílusa -->
    <link rel="stylesheet" href="meretvalto.css">
</head>

<body>

    <main class="main-screen">

        <!-- Méretváltó háttér -->
        <div class="app-frame mv-bg">

            <!-- Vissza gomb -->
            <a href="index.html" class="back-btn">Vissza</a>

            <!-- Gombok -->
            <div class="button-container">

                <button class="main-button mv-btn"
                    onclick="openTL('Méretváltó 1', '(0) 06/70-685-9576', '+36706859576')">
                    Méretváltó 1
                </button>

                <button class="main-button mv-btn"
                    onclick="openTL('Méretváltó 2', '(0) 06/70-685-9567', '+36706859567')">
                    Méretváltó 2
                </button>

            </div>

        </div>

    </main>

    <!-- POPUP (BottomSheet) -->
    <div id="popup" class="popup-overlay">

        <div class="popup-content">

            <div id="popupName" class="popup-name"></div>
            <div id="popupInternal" class="popup-internal"></div>

            <div class="popup-mobile-text">Mobilon hívom</div>

            <img id="popupPhone" src="ic_phone.png" class="popup-phone-icon">

            <button class="popup-close" onclick="closePopup()">Bezárás</button>

        </div>

    </div>

    <!-- Script -->
    <script src="script.js"></script>

</body>
</html>
